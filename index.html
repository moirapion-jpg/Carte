<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine de Nancy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26485e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f2f3f0;--card:#fff;--tx:#1d2a30;--mu:#65737a;--bd:#d9dedb;--ac:#26485e;
--p0:#b07d0b;--p1:#5b4b9a;--p2:#1f7a6e;--p3:#c8452c}
@media (prefers-color-scheme:dark){:root{--bg:#161d21;--card:#1f282d;--tx:#eef1ef;--mu:#9aa8ae;--bd:#33414a;--ac:#8fb8d0;--p0:#d9aa2b;--p1:#a99be8;--p2:#4fc2b0;--p3:#f0836a}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Public Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:12px 14px 90px}
[hidden]{display:none!important}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:6px 0 2px}h1{font-size:25px}h2{font-size:22px}h3{font-size:15px;margin:18px 0 6px}
.sub,.meta{color:var(--mu);font-size:13px}.meta{margin:3px 0}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 11px;cursor:pointer}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}summary::-webkit-details-marker{display:none}summary::after{content:'▾';color:var(--mu)}details[open] summary::after{content:'▴'}.cnt{background:var(--ac);color:var(--bg);border-radius:999px;font-size:12px;padding:0 8px;margin-left:8px;font-weight:400}
#map{height:58vh;min-height:340px;border-radius:12px;border:1px solid var(--bd);z-index:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.pill{display:inline-block;color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;margin-right:6px}.pill.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px;font:inherit;font-size:14px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:76px;height:76px;object-fit:cover;border-radius:8px;cursor:pointer}
.st{font-size:22px;border:0;background:none;padding:0 2px;color:var(--mu)}.st.on{color:#e0a800;background:none}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0);z-index:2000}#tabs button{flex:1;border:0;border-radius:0;background:var(--card);padding:13px 6px;font-size:14px}#tabs button.on{background:var(--card);color:var(--ac);font-weight:600;box-shadow:inset 0 3px 0 var(--ac)}.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.pin{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;box-sizing:border-box}
.pin.v{opacity:.6}.pin.s{transform:scale(1.3)}.pin b{position:absolute;top:-8px;right:-7px;background:#fff;color:#111;border-radius:50%;font-size:11px;width:15px;height:15px;line-height:15px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Patrimoine de Nancy</h1>
<div class="sub">Prototype. Fiches à relire ; votre carnet reste sur cet appareil.</div>
<div id="v-map"><div class="card" id="prog"></div>
<div class="card" id="filters"></div>
<div id="map"></div>
<div class="row"><button id="loc">📍 Me localiser</button><span class="sub" id="locmsg" style="align-self:center"></span></div>
<div class="sub" id="leg"></div>
<div id="detail"></div></div>
<div id="v-log" hidden></div>
</main>
<nav id="tabs"><button data-tab="map" class="on">🗺️ Carte</button><button data-tab="log">✓ Visités <span id="tc"></span></button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== DONNÉES : une fiche par lieu. Pour ajouter un lieu, copiez un bloc. =====
 p = période (0 Antiquité, 1 Moyen Âge, 2 Temps modernes, 3 Époque contemporaine) ; t = thème (voir TH) ; s = style ou mouvement */
const PER=[['Antiquité','var(--p0)'],['Moyen Âge','var(--p1)'],['Temps modernes','var(--p2)'],['Époque contemporaine','var(--p3)']];
const COL=['#b07d0b','#5b4b9a','#1f7a6e','#c8452c'];
const TH={rel:['⛪','Religieux'],def:['🏰','Défense'],res:['🏠','Résidentiel'],civ:['🏛️','Civil et public'],com:['🛍️','Commerce et industrie'],cul:['🎭','Culture'],urb:['⛲','Places et urbanisme'],fun:['🪦','Funéraire']};
const P=[
{id:'st',n:'Place Stanislas',la:48.6936,lo:6.1832,p:2,t:'urb',s:'Classique',dat:'1752–1755',arc:'Emmanuel Héré, pour le duc Stanislas',d:'Place royale ouverte sur l’hôtel de ville, conçue pour relier la vieille ville et la ville neuve. Avec la place de la Carrière et la place d’Alliance, elle forme un ensemble classé à l’Unesco depuis 1983.',o:'Les grilles et fontaines en fer forgé doré de Jean Lamour aux angles de la place.',inf:'Accès libre en tout temps.'},
{id:'cr',n:'Porte de la Craffe',la:48.6966,lo:6.1745,p:1,t:'def',s:'Fortification',dat:'XIVe siècle',arc:'À préciser',d:'Porte fortifiée, vestige de l’enceinte médiévale de la ville.',o:'Les deux tours massives qui encadrent le passage.',inf:'Extérieur visible librement.'},
{id:'se',n:'Basilique Saint-Epvre',la:48.6946,lo:6.1850,p:3,t:'rel',s:'Néogothique',dat:'XIXe siècle (à préciser)',arc:'Prosper Morey (à vérifier)',d:'Église néogothique du quartier Saint-Epvre, au cœur de la vieille ville.',o:'La flèche et le décor sculpté de la façade.',inf:'Horaires d’ouverture à vérifier.'},
{id:'vm',n:'Villa Majorelle',la:48.6842,lo:6.1695,p:3,t:'res',s:'Art nouveau',dat:'vers 1901–1902 (les sources divergent)',arc:'Henri Sauvage, pour Louis Majorelle',d:'Villa de l’ébéniste Louis Majorelle, manifeste de l’École de Nancy. Monument historique depuis 1975.',o:'La façade en béton et brique à motifs floraux, le grès flammé de Bigot, les vitraux de Gruber.',inf:'Visite sur réservation (à vérifier).'},
{id:'ex',n:'Brasserie Excelsior',la:48.6922,lo:6.1765,p:3,t:'com',s:'Art nouveau',dat:'vers 1910',arc:'Lucien Weissenburger (à vérifier)',d:'Brasserie au décor Art nouveau remarquablement préservé, près de la gare.',o:'Les lustres, boiseries et verrières de la grande salle.',inf:'Ouverte au public (horaires à vérifier).'}];
/* ===== FIN DES DONNÉES ===== */
const $=i=>document.getElementById(i),get=i=>P.find(p=>p.id===i);
const F={p:new Set,t:new Set,s:new Set};let sel=null,vf='all',C={},warn='';
try{C=JSON.parse(localStorage.getItem('nancy-carnet')||'{}')}catch(e){}
const rec=i=>C[i]||(C[i]={v:0,d:'',note:'',r:0,ph:[]});
function save(){warn='';try{localStorage.setItem('nancy-carnet',JSON.stringify(C))}catch(e){warn='Enregistrement impossible : espace plein ?'}}
const map=L.map('map',{zoomControl:true}).setView([48.6925,6.178],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© les contributeurs d’<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
map.fitBounds(L.latLngBounds(P.map(p=>[p.la,p.lo])),{padding:[40,40]});
const layer=L.layerGroup().addTo(map);
const vis=p=>(!F.p.size||F.p.has(p.p))&&(!F.t.size||F.t.has(p.t))&&(!F.s.size||F.s.has(p.s))&&(vf==='all'||(vf==='done')===!!(C[p.id]&&C[p.id].v));
const openG=new Set();
function filters(){
 const SET={p:F.p,s:F.s,t:F.t},n=F.p.size+F.s.size+F.t.size;
 const G=[['p','Époque',()=>[...new Set(P.map(p=>p.p))].sort(),k=>`<span class="dot" style="background:${PER[k][1]}"></span>${PER[k][0]}`],['s','Mouvement',()=>[...new Set(P.map(p=>p.s))].sort(),k=>k],['t','Type',()=>[...new Set(P.map(p=>p.t))],k=>`${TH[k][0]} ${TH[k][1]}`]];
 $('filters').innerHTML=`<div class="row">${[['all','Tous'],['todo','À visiter'],['done','Visités']].map(([k,v])=>`<button data-v="${k}" class="${vf===k?'on':''}">${v}</button>`).join('')}</div>`
 +G.map(([g,lab,items,fmt])=>`<details data-g="${g}" ${openG.has(g)?'open':''}><summary><span>${lab}${SET[g].size?`<span class="cnt">${SET[g].size}</span>`:''}</span></summary><div class="row">${items().map(k=>`<button data-g="${g}" data-k="${k}" class="${SET[g].has(k)?'on':''}">${fmt(k)}</button>`).join('')}</div></details>`).join('')
 +(n?'<div class="row"><button id="clr">Effacer les filtres</button></div>':'');
 $('filters').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vf=b.dataset.v;render()});
 $('filters').querySelectorAll('details').forEach(d=>d.ontoggle=()=>{d.open?openG.add(d.dataset.g):openG.delete(d.dataset.g)});
 $('filters').querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{const k=isNaN(b.dataset.k)?b.dataset.k:+b.dataset.k,s=SET[b.dataset.g];s.has(k)?s.delete(k):s.add(k);render()});
 if(n)$('clr').onclick=()=>{F.p.clear();F.s.clear();F.t.clear();render()}}
function render(){
 const done=P.filter(p=>C[p.id]&&C[p.id].v).length,n=P.length;$('tc').textContent=done?'('+done+')':'';
 $('prog').innerHTML=`<strong>${done} lieu${done>1?'x':''} visité${done>1?'s':''} sur ${n}</strong>, ${n-done} restant${n-done>1?'s':''}<div class="bar"><i style="width:${done/n*100}%"></i></div>`;
 filters();
 $('leg').innerHTML=PER.map(p=>`<span class="dot" style="background:${p[1]}"></span>${p[0]}`).join('&nbsp; ');
 layer.clearLayers();
 P.filter(vis).forEach(p=>{const v=C[p.id]&&C[p.id].v;
  const ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="pin ${v?'v':''} ${sel===p.id?'s':''}" style="background:${COL[p.p]}">${TH[p.t][0]}${v?'<b>✓</b>':''}</div>`});
  L.marker([p.la,p.lo],{icon:ic,title:p.n}).on('click',()=>{sel=p.id;render();$('detail').scrollIntoView({behavior:'smooth'})}).addTo(layer)});
 detail()}
function detail(){
 const p=sel&&get(sel);if(!p){$('detail').innerHTML='<div class="card sub">Touchez un lieu sur la carte pour ouvrir sa fiche.</div>';return}
 const r=rec(p.id);
 $('detail').innerHTML=`<div class="card"><h2>${p.n}</h2>
 <div>${TH[p.t][0]} ${TH[p.t][1]}</div>
 <div style="margin-top:4px"><span class="pill" style="background:${PER[p.p][1]}">${PER[p.p][0]}</span><span class="pill o">${p.s}</span></div>
 <div class="meta" style="margin-top:8px">${p.dat}, ${p.arc}</div>
 <p>${p.d}</p><div><strong>À observer :</strong> ${p.o}</div>
 <div class="meta" style="margin-top:6px">${p.inf}</div><div class="meta">Fiche : brouillon, à relire.</div>
 <h3>Mon carnet</h3>
 <button id="vis" class="${r.v?'on':''}">${r.v?'✓ Visité le '+r.d:'Marquer comme visité'}</button>
 <div style="margin:10px 0">${[1,2,3,4,5].map(i=>`<button class="st ${r.r>=i?'on':''}" data-r="${i}" aria-label="${i} étoiles">★</button>`).join('')}</div>
 <textarea id="note" rows="3" placeholder="Mes notes et mon avis">${esc(r.note)}</textarea>
 <div class="row"><input type="file" id="file" accept="image/*" multiple hidden><button id="add">📷 Ajouter des photos</button></div>
 <div class="ph">${r.ph.map((s,i)=>`<img src="${s}" data-i="${i}" alt="Photo ${i+1}">`).join('')}</div>
 <div class="sub" id="warn">${warn||(r.ph.length?'Touchez une photo pour la supprimer.':'')}</div></div>`;
 $('vis').onclick=()=>{r.v=r.v?0:1;r.d=r.v?new Date().toLocaleDateString('fr-FR'):'';save();render()};
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{r.r=r.r===+b.dataset.r?0:+b.dataset.r;save();detail()});
 $('note').oninput=e=>{r.note=e.target.value;save();$('warn').textContent=warn};
 document.querySelectorAll('.ph img').forEach(im=>im.onclick=()=>{if(confirm('Supprimer cette photo ?')){r.ph.splice(+im.dataset.i,1);save();detail()}});
 $('add').onclick=()=>$('file').click();
 $('file').onchange=async e=>{for(const f of [...e.target.files].slice(0,4-r.ph.length)){try{r.ph.push(await shrink(f))}catch(x){}}save();detail()}}
function shrink(f){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=ko;fr.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(f)})}
let me=null;
$('loc').onclick=()=>{$('locmsg').textContent='Recherche de votre position…';map.locate({enableHighAccuracy:true,timeout:10000})};
map.on('locationfound',e=>{if(me)me.remove();me=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#2a7de1',fillOpacity:1}).addTo(map);
 const far=e.latlng.distanceTo([48.6925,6.178])>30000;$('locmsg').textContent=far?'Vous êtes loin de Nancy.':'Position trouvée.';if(!far)map.setView(e.latlng,16)});
map.on('locationerror',()=>{$('locmsg').textContent='Position indisponible : vérifiez l’autorisation de localisation.'});
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='map',grp='p';
function logView(){
 const vp=P.filter(p=>C[p.id]&&C[p.id].v),n=P.length;
 const GR={p:[()=>[...new Set(P.map(x=>x.p))].sort(),k=>PER[k][0],x=>x.p,k=>`<span class="dot" style="background:${PER[k][1]}"></span>`],
 s:[()=>[...new Set(P.map(x=>x.s))].sort(),k=>k,x=>x.s,k=>''],
 t:[()=>[...new Set(P.map(x=>x.t))],k=>TH[k][0]+' '+TH[k][1],x=>x.t,k=>'']};
 const [keys,name,of,mark]=GR[grp];
 $('v-log').innerHTML=`<div class="card"><strong>${vp.length} lieu${vp.length>1?'x':''} visité${vp.length>1?'s':''} sur ${n}</strong><div class="bar"><i style="width:${vp.length/n*100}%"></i></div>${vp.length?'':'<div class="meta" style="margin-top:8px">Marquez un lieu comme visité depuis sa fiche pour le retrouver ici.</div>'}</div>
 <div class="row">${[['p','Par époque'],['s','Par mouvement'],['t','Par type']].map(([k,v])=>`<button data-grp="${k}" class="${grp===k?'on':''}">${v}</button>`).join('')}</div>`
 +keys().map(k=>{const all=P.filter(x=>of(x)===k),v=all.filter(x=>C[x.id]&&C[x.id].v);
  return `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong>${mark(k)}${name(k)}</strong><span class="meta">${v.length} sur ${all.length}</span></div>`
  +(v.length?v.map(x=>{const r=C[x.id];return `<div class="li" data-id="${x.id}"><div><strong>${x.n}</strong><div class="meta">${esc(r.d)}${r.r?', '+'★'.repeat(r.r):''}</div>${r.note?`<div class="meta">${esc(r.note.slice(0,90))}${r.note.length>90?'…':''}</div>`:''}</div><span class="meta">›</span></div>`}).join(''):'<div class="meta">Aucun lieu visité pour l’instant.</div>')+'</div>'}).join('');
 $('v-log').querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{grp=b.dataset.grp;logView()});
 $('v-log').querySelectorAll('.li').forEach(e=>e.onclick=()=>{sel=e.dataset.id;setTab('map');render();$('detail').scrollIntoView()})}
function setTab(t){tab=t;$('v-map').hidden=t!=='map';$('v-log').hidden=t!=='log';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 if(t==='map')setTimeout(()=>map.invalidateSize(),50);else{logView();scrollTo(0,0)}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
